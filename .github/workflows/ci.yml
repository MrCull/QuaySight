name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same branch or PR cancels the run still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan (tracked tree)
        run: node scripts/check-secrets.mjs

      - name: Check (lint, tokens, type-check, build)
        run: npm run check

      # Tests are off by default. To switch them on without a code change, set the repository
      # variable RUN_TESTS to "true" (Settings > Secrets and variables > Actions > Variables).
      - name: Install Playwright chromium
        if: vars.RUN_TESTS == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests (unit and e2e)
        if: vars.RUN_TESTS == 'true'
        run: npm run check:tests

      - name: Upload Playwright report
        if: failure() && vars.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
