<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Stage progress</title>
<style>body{margin:0;padding:24px;background:var(--surface);max-width:520px}</style></head>
<body class="qs-root">
<ol class="qs-stages" aria-live="polite">
  <li class="qs-stage qs-stage--done"><span class="qs-stage__dot"><i class="qs-glyph qs-glyph--check"></i></span><span class="qs-stage__title">Reading markings</span><span class="qs-stage__time">2.4 s</span></li>
  <li class="qs-stage qs-stage--done"><span class="qs-stage__dot"><i class="qs-glyph qs-glyph--check"></i></span><span class="qs-stage__title">Looking for damage</span><span class="qs-stage__time">3.1 s</span></li>
  <li class="qs-stage qs-stage--active"><span class="qs-stage__dot"></span><span class="qs-stage__title">Checking the details</span><span class="qs-stage__time">0.8 s</span><span class="qs-stage__detail">Taking a closer look at characters that were hard to read</span></li>
  <li class="qs-stage"><span class="qs-stage__dot"></span><span class="qs-stage__title">Putting the results together</span><span class="qs-stage__time"></span></li>
</ol>
</body></html>
