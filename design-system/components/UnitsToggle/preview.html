<!-- @dsCard group="Controls" height=300 subtitle="Metric / Imperial, in the Container details heading" -->
<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Units toggle</title>
<style>
body{margin:0;padding:24px;background:var(--bg);display:grid;gap:var(--space-5);max-width:540px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-5)}
.head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-3)}
.k{font:600 12px/16px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
</style></head>
<body class="qs-root">
<div class="card">
  <div class="head"><span class="k">Container details</span>
    <div class="qs-seg" role="group" aria-label="Units">
      <button type="button" class="qs-seg__opt" aria-pressed="true"><i class="qs-glyph qs-glyph--check"></i>Metric</button>
      <button type="button" class="qs-seg__opt" aria-pressed="false"><i class="qs-glyph qs-glyph--check"></i>Imperial</button>
    </div>
  </div>
  <div class="qs-field">
    <span class="qs-field__label">Max gross</span>
    <span class="qs-field__value">30,480 kg <span class="qs-prov">Printed</span></span>
    <span class="qs-cert qs-cert--confident"><i class="qs-glyph qs-glyph--confident"></i>Confident</span>
  </div>
</div>
<div class="card">
  <div class="head"><span class="k">Container details</span>
    <div class="qs-seg" role="group" aria-label="Units">
      <button type="button" class="qs-seg__opt" aria-pressed="false"><i class="qs-glyph qs-glyph--check"></i>Metric</button>
      <button type="button" class="qs-seg__opt" aria-pressed="true"><i class="qs-glyph qs-glyph--check"></i>Imperial</button>
    </div>
  </div>
  <div class="qs-field">
    <span class="qs-field__label">Max gross</span>
    <span class="qs-field__value">67,200 lb <span class="qs-prov">Printed</span></span>
    <span class="qs-cert qs-cert--confident"><i class="qs-glyph qs-glyph--confident"></i>Confident</span>
  </div>
</div>
</body></html>
