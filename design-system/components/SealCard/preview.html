<!-- @dsCard group="Evidence" height=560 subtitle="Seal number character by character, with where it was read" -->
<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Seal card</title>
<style>
body{margin:0;padding:var(--space-6);background:var(--bg);max-width:540px}
.stack{display:grid;gap:var(--space-4)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-5)}
.head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-3)}
.k{font:600 12px/16px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.note{margin:0;color:var(--ink-muted);font:400 14px/20px var(--font-sans)}
.crop{margin:var(--space-4) 0 0}
.crop__frame{width:100%;max-width:280px;aspect-ratio:2 / 1;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-sunken)}
.crop figcaption{margin:var(--space-2) 0 0;color:var(--ink-muted);font:400 14px/20px var(--font-sans)}
</style></head>
<body class="qs-root">
<div class="stack qs-arrived">

  <!-- Read -->
  <div class="card">
    <div class="head"><span class="k">Seal</span><span class="qs-cert qs-cert--confident"><i class="qs-glyph qs-glyph--confident"></i>Confident</span></div>
    <div class="qs-id qs-id--md" aria-label="4 2 1 7 0 9 5">
      <span class="qs-id__group"><span class="qs-id__ch">4</span><span class="qs-id__ch">2</span><span class="qs-id__ch">1</span><span class="qs-id__ch">7</span><span class="qs-id__ch">0</span><span class="qs-id__ch">9</span><span class="qs-id__ch">5</span></span>
    </div>
    <figure class="crop"><div class="crop__frame" role="img" aria-label="The seal, enlarged"></div><figcaption>Where we read the seal</figcaption></figure>
  </div>

  <!-- Partly read -->
  <div class="card">
    <div class="head"><span class="k">Seal</span><span class="qs-cert qs-cert--uncertain"><i class="qs-glyph qs-glyph--uncertain"></i>Uncertain</span></div>
    <div class="qs-id qs-id--md" aria-label="4 2, position 3 not read, 7 (likely), 0 9 5">
      <span class="qs-id__group"><span class="qs-id__ch">4</span><span class="qs-id__ch">2</span><span class="qs-id__ch" data-c="unknown">·</span><span class="qs-id__ch" data-c="likely">7</span><span class="qs-id__ch">0</span><span class="qs-id__ch">9</span><span class="qs-id__ch">5</span></span>
    </div>
  </div>

  <!-- None visible -->
  <div class="card">
    <div class="head"><span class="k">Seal</span><span class="qs-cert qs-cert--unseen"><i class="qs-glyph qs-glyph--unseen"></i>Not seen</span></div>
    <p class="note">No seal visible in this photo</p>
  </div>

</div>
</body></html>
