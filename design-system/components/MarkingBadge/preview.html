<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Marking badge</title>
<style>body{margin:0;padding:24px;background:var(--surface)} .row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}</style></head>
<body class="qs-root">
<div class="row">
  <span class="qs-marking qs-marking--hazard"><i class="qs-glyph qs-glyph--hazard"></i><span>DG placard, class 3 visible<span class="qs-marking__caveat">Cargo status unknown without a declaration</span></span></span>
  <span class="qs-marking qs-marking--hazard"><i class="qs-glyph qs-glyph--hazard"></i>SUPER HEAVY marking</span>
  <span class="qs-marking"><i class="qs-glyph qs-glyph--check"></i>High-container stripes</span>
  <span class="qs-marking"><i class="qs-glyph qs-glyph--eye"></i><span>No DG placard visible<span class="qs-marking__caveat">Not evidence that cargo is non-hazardous</span></span></span>
</div>
