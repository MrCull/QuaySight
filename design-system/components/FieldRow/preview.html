<!-- @dsCard group="Evidence" height=300 subtitle="A read-only reading: value, provenance, certainty" -->
<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Field row</title>
<style>body{margin:0;padding:8px 24px 16px;background:var(--surface)}</style></head>
<body class="qs-root">
<div>
  <div class="qs-field">
    <span class="qs-field__label">Max gross</span>
    <span class="qs-field__value">32,500 kg <span class="qs-prov">Printed</span></span>
    <span class="qs-cert qs-cert--confident"><i class="qs-glyph qs-glyph--confident"></i>Confident</span>
  </div>
  <div class="qs-field">
    <span class="qs-field__label">Tare</span>
    <span class="qs-field__value">3,750 kg <span class="qs-prov">Printed</span></span>
    <span class="qs-cert qs-cert--uncertain"><i class="qs-glyph qs-glyph--uncertain"></i>Uncertain</span>
    <span class="qs-field__note"><strong>Best interpretation:</strong> 3,750 kg. <strong>What remains uncertain:</strong> the last digits are hard to read; it could be 3,780 kg.</span>
  </div>
  <div class="qs-field">
    <span class="qs-field__label">Max payload</span>
    <span class="qs-field__value">28,750 kg <span class="qs-prov qs-prov--calculated">Calculated</span></span>
    <span class="qs-cert qs-cert--likely"><i class="qs-glyph qs-glyph--likely"></i>Likely</span>
  </div>
  <div class="qs-field">
    <span class="qs-field__label">Cubic capacity</span>
    <span class="qs-field__value qs-field__value--absent">Not visible in this photo</span>
    <span class="qs-cert qs-cert--unseen"><i class="qs-glyph qs-glyph--unseen"></i>Not seen</span>
  </div>
</div>
</body></html>
