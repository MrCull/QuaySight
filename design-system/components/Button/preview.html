<!-- @dsCard group="Actions" height=190 subtitle="One brand action per screen" -->
<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Button</title>
<style>body{margin:0;padding:24px;background:var(--bg)} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style></head>
<body class="qs-root">
<div class="row">
  <button class="qs-btn qs-btn--primary qs-btn--lg">Continue</button>
  <button class="qs-btn qs-btn--primary qs-btn--sm qs-newinsp">New inspection</button>
  <button class="qs-btn qs-btn--secondary">Try again</button>
  <button class="qs-btn qs-btn--secondary">Keep first result</button>
  <button class="qs-btn qs-btn--secondary"><i class="qs-glyph qs-glyph--upload"></i>Export JSON</button>
  <button class="qs-btn qs-btn--ghost">Clear key</button>
</div>
<div class="row" style="margin-top:12px">
  <!-- During a run New inspection reads Cancel; it stays the one primary button and is never disabled. -->
  <button class="qs-btn qs-btn--primary qs-btn--sm qs-newinsp">Cancel</button>
  <button class="qs-btn qs-btn--secondary" aria-busy="true" disabled>Check again with this manifest</button>
</div>
</body></html>
