<!-- @dsCard group="Evidence" height=230 subtitle="Per-character certainty, boxed check digit" -->
<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Container ID</title>
<style>body{margin:0;padding:24px;background:var(--surface)} .k{font:600 13px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:8px} .alt{margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--ink-muted);font:400 14px/20px var(--font-sans)}</style></head>
<body class="qs-root">
  <div class="k">Container ID</div>
  <div class="qs-id" aria-label="Q S I U 3 0 7 4 2 8, check digit 8. Fifth serial digit uncertain.">
    <span class="qs-id__group"><span class="qs-id__ch">Q</span><span class="qs-id__ch">S</span><span class="qs-id__ch">I</span><span class="qs-id__ch">U</span></span>
    <span class="qs-id__group"><span class="qs-id__ch">3</span><span class="qs-id__ch">0</span><span class="qs-id__ch">7</span></span>
    <span class="qs-id__group"><span class="qs-id__ch" data-c="likely">4</span><span class="qs-id__ch" data-c="uncertain">2</span><span class="qs-id__ch">8</span></span>
    <span class="qs-id__check">8</span>
  </div>
  <div class="qs-id__meta">
    <span class="qs-cert qs-cert--likely"><i class="qs-glyph qs-glyph--likely"></i>Likely</span>
    <span class="qs-prov">Printed</span>
    <span class="qs-prov qs-prov--calculated">Check digit valid</span>
  </div>
  <div class="alt">Also possible <span style="font:500 15px var(--font-mono);color:var(--ink)">QSIU 307478 1</span> · the fifth digit could be a 7; the printed check digit favours 2</div>
</body></html>
