<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Finding card</title>
<style>body{margin:0;padding:24px;background:var(--bg);max-width:480px} .list{display:grid;gap:10px}</style></head>
<body class="qs-root">
<div class="list qs-arrived" id="f">
<button class="qs-finding qs-rise" style="--i:0" data-finding="1" aria-pressed="false">
  <span class="qs-finding__n qs-finding__n--major qs-finding__n--uncertain">1</span>
  <span><span class="qs-finding__title">Possible hole</span><br><span class="qs-finding__loc">Right side · section 7, upper · photo 2</span></span>
  <span class="qs-finding__tags"><span class="qs-sev qs-sev--major"><span class="qs-sev__bars"><i></i><i></i><i></i><i></i></span><span class="qs-sev__code">HO</span>Major</span><span class="qs-cert qs-cert--uncertain"><i class="qs-glyph qs-glyph--uncertain"></i>Uncertain</span></span>
  <span class="qs-finding__more"><span><strong>Best interpretation:</strong> a small dark opening in the upper panel.</span><span><strong>What remains uncertain:</strong> it could be a decal or a shadow. A closer photo would settle it.</span></span>
</button>
<button class="qs-finding qs-rise" style="--i:1" data-finding="2" aria-pressed="true">
  <span class="qs-finding__n qs-finding__n--moderate">2</span>
  <span><span class="qs-finding__title">Dent in the door panel</span><br><span class="qs-finding__loc">Rear doors · right door, lower panel · photo 1</span></span>
  <span class="qs-finding__tags"><span class="qs-sev qs-sev--moderate"><span class="qs-sev__bars"><i></i><i></i><i></i><i></i></span><span class="qs-sev__code">DT</span>Moderate</span><span class="qs-cert qs-cert--confident"><i class="qs-glyph qs-glyph--confident"></i>Confident</span></span>
  <span class="qs-finding__more">
    <span>A local inward dent across two ribs, roughly a third of the door width. Not a sharp bend.</span>
    <span class="qs-finding__probs" aria-label="Model probability, GPT-6 Luna">
      <span class="qs-prob qs-prob--top"><span>DT dent</span><span class="qs-prob__bar"><i style="--p:74%"></i></span><span>0.74</span></span>
      <span class="qs-prob"><span>BT bend</span><span class="qs-prob__bar"><i style="--p:18%"></i></span><span>0.18</span></span>
      <span class="qs-prob"><span>BW bow</span><span class="qs-prob__bar"><i style="--p:6%"></i></span><span>0.06</span></span>
    </span>
    <span>How strongly GPT-6 Luna rated each description. Not a measured accuracy.</span>
  </span>
</button>
<button class="qs-finding qs-rise" style="--i:2" data-finding="3" aria-pressed="false">
  <span class="qs-finding__n qs-finding__n--minor qs-finding__n--likely">3</span>
  <span><span class="qs-finding__title">Surface corrosion</span><br><span class="qs-finding__loc">Rear doors · left door, bottom edge · photo 1</span></span>
  <span class="qs-finding__tags"><span class="qs-sev qs-sev--minor"><span class="qs-sev__bars"><i></i><i></i><i></i><i></i></span><span class="qs-sev__code">CO</span>Minor</span><span class="qs-cert qs-cert--likely"><i class="qs-glyph qs-glyph--likely"></i>Likely</span></span>
  <span class="qs-finding__more"><span><strong>Best interpretation:</strong> surface rust streaks along the door bottom, no visible perforation.</span></span>
</button>
<button class="qs-finding qs-rise" style="--i:3" data-finding="4" aria-pressed="false">
  <span class="qs-finding__n qs-finding__n--cosmetic qs-finding__n--likely">4</span>
  <span><span class="qs-finding__title">Corrosion on the side sheet</span><br><span class="qs-finding__loc">Photo column 4 of 5 from the left, upper half of the side sheet</span></span>
  <span class="qs-finding__tags"><span class="qs-sev qs-sev--cosmetic"><span class="qs-sev__bars"><i></i><i></i><i></i><i></i></span><span class="qs-sev__code">CO</span>Cosmetic</span><span class="qs-cert qs-cert--likely"><i class="qs-glyph qs-glyph--likely"></i>Likely</span></span>
  <span class="qs-finding__more"><span><strong>Best interpretation:</strong> apparent cosmetic corrosion.</span></span>
</button>
<button class="qs-finding qs-rise" style="--i:4" data-finding="5" aria-pressed="false">
  <span class="qs-finding__n qs-finding__n--unrated qs-finding__n--uncertain">5</span>
  <span><span class="qs-finding__title">Damage to the bottom side rail</span><br><span class="qs-finding__loc">Bottom side rail</span></span>
  <span class="qs-finding__tags"><span class="qs-sev qs-sev--unrated"><span class="qs-sev__bars"><i></i><i></i><i></i><i></i></span><span class="qs-sev__code">BT</span>Not rated</span><span class="qs-cert qs-cert--uncertain"><i class="qs-glyph qs-glyph--uncertain"></i>Uncertain</span></span>
  <span class="qs-finding__more"><span><strong>What remains uncertain:</strong> the photo gives no severity rating for this component.</span></span>
</button></div>
<script>
function qsSelect(root, n){
  root.querySelectorAll('[data-finding]').forEach(function(el){
    var on = el.getAttribute('data-finding') === String(n);
    el.classList.toggle('is-selected', on);
    if (el.hasAttribute('aria-pressed')) el.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}
function qsBindSelect(root){
  root.querySelectorAll('[data-finding]').forEach(function(el){
    if (!(el.matches('.qs-pin, .qs-finding, .qs-photo-region'))) return;
    el.addEventListener('click', function(){ qsSelect(root, el.getAttribute('data-finding')); });
    el.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); qsSelect(root, el.getAttribute('data-finding')); } });
  });
}
 qsBindSelect(document.getElementById('f'));</script>
</body></html>
